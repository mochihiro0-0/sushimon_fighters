<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ミッション3｜落下する人を救え</title>
  <style>
    :root{font-family:"BIZ UDPGothic","Yu Gothic",sans-serif;color:#f7fbff;background:#030919;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:linear-gradient(#061a3a,#1a2751 55%,#07101e)}.arena{position:relative;display:grid;height:100vh;place-items:center;overflow:hidden}.building{position:absolute;right:5%;top:0;width:25%;height:82%;background:linear-gradient(90deg,#08111f,#182d49 48%,#07101e);box-shadow:-10px 0 28px #0008}.building:before{position:absolute;inset:7%;background:repeating-linear-gradient(#ffd86e 0 6%,transparent 6% 13%);opacity:.4;content:""}.mission-copy{position:absolute;z-index:6;top:clamp(12px,3vw,28px);left:clamp(14px,3vw,32px);max-width:62%}.tag{margin:0;color:#ffd84a;font-size:clamp(.6rem,1.6vw,.78rem);font-weight:900;letter-spacing:.16em}.mission-copy h1{margin:.2rem 0;font-size:clamp(1.35rem,5vw,3.2rem);line-height:1.05;text-shadow:0 0 18px #54ecff88}.mission-copy p{margin:.3rem 0;color:#bed2ea;font-size:clamp(.7rem,1.8vw,.95rem)}.falling{position:absolute;z-index:4;right:22%;top:15%;font-size:clamp(2.5rem,7vw,5rem);animation:fall 10s linear forwards}.target-zone{position:absolute;left:43%;top:64%;width:min(34vw,220px);aspect-ratio:1;border:3px dashed #ffd84a;border-radius:50%;box-shadow:0 0 28px #ffd84a77;transform:translate(-50%,-50%)}.target-zone:before{position:absolute;inset:15%;border:2px solid #54ecff55;border-radius:50%;content:""}.circle{position:absolute;left:43%;top:64%;width:70px;aspect-ratio:1;border:3px solid #54ecff;border-radius:50%;box-shadow:0 0 25px #54ecff,inset 0 0 28px #54ecff55;transform:translate(-50%,-50%);transition:.16s}.circle span{position:absolute;inset:0;display:grid;place-items:center;color:#54ecff;font:900 1.8em/1 sans-serif}.meter{position:absolute;z-index:7;left:5%;bottom:7%;width:min(55%,430px)}.meter-track{position:relative;height:20px;border:1px solid #4f759d;border-radius:99px;background:#071426}.good-zone{position:absolute;left:43%;width:24%;height:100%;background:#5dffb355}.needle{position:absolute;top:-7px;left:0;width:4px;height:34px;border-radius:4px;background:white;box-shadow:0 0 10px #54ecff;transition:left .16s}.meter-labels{display:flex;justify-content:space-between;margin-top:.45rem;color:#b8cce2;font-size:clamp(.65rem,2vw,.82rem)}.feedback{margin:.45rem 0 0;color:#ffd84a;font-weight:900;text-align:center}.result{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#020715dd;text-align:center}.result[hidden]{display:none}.result strong{font-size:clamp(2.1rem,9vw,5.5rem);text-shadow:0 0 25px currentColor}.result.success strong{color:#5dffb3}.result.fail strong{color:#ff647c}.result p{color:#d5e5f6}@keyframes fall{to{top:70%;transform:rotate(220deg)}}@media(max-height:430px){.target-zone{width:38vh}.mission-copy h1{font-size:1.3rem}.falling{font-size:11vh}.meter{bottom:3%}}
  </style>
</head>
<body><main class="arena"><div class="building"></div><section class="mission-copy"><p class="tag">MISSION 03 / CONTROL</p><h1>落下する人を救え！</h1><p><strong>△デルタ</strong>を黄色い円と同じ大きさに近づけろ。</p></section><div class="falling" aria-hidden="true">🧑‍🚀</div><div class="target-zone"></div><div class="circle" id="circle"><span>△</span></div><section class="meter"><div class="meter-track"><div class="good-zone"></div><div class="needle" id="needle"></div></div><div class="meter-labels"><span>小さい</span><span>救助サイズ</span><span>大きい</span></div><p class="feedback" id="feedback">形を作って大きさを合わせよう</p></section><section class="result" id="result" hidden><div><strong id="resultTitle"></strong><p id="resultText"></p></div></section></main>
  <script>
    // このHTMLだけが「設定された大きさに近いか」を判定します。
    const targetSize=.55,tolerance=.12;let bestDiff=1,bestSize=0,ended=false;
    function cast(data){if(ended||data.gesture!=='delta')return;const size=Math.max(.05,Math.min(.95,data.size||.45));const diff=Math.abs(size-targetSize);if(diff<bestDiff){bestDiff=diff;bestSize=size}document.getElementById('needle').style.left=`${size*100}%`;const diameter=55+size*250;document.getElementById('circle').style.width=`${diameter}px`;document.getElementById('circle').style.fontSize=`${Math.max(18,diameter*.34)}px`;document.getElementById('feedback').textContent=diff<=tolerance?'その大きさだ！保て！':size<targetSize?'もっと大きく！':'少し小さく！'}
    function finish(){if(ended)return;ended=true;const success=bestDiff<=tolerance;const score=Math.max(0,Math.round(100-bestDiff*250));const box=document.getElementById('result');box.hidden=false;box.className=`result ${success?'success':'fail'}`;document.getElementById('resultTitle').textContent=success?'救助成功！':'救助失敗！';document.getElementById('resultText').textContent=success?'デルタの力で、やさしく受け止めた。':'黄色い円に近い大きさをねらおう。';parent.postMessage({type:'mission-result',success,score,reason:'size-match'},'*')}
    addEventListener('message',e=>{const d=e.data||{};if(d.type==='mission-start')setTimeout(finish,10000);if(d.type==='gesture')cast(d)});
    parent.postMessage({type:'mission-ready',mission:'rescue',title:'落下する人を救え！',instruction:'△デルタを黄色い円と同じ大きさにせよ'},'*');
  </script>
</body></html>
