<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ミッション2｜怪獣を倒せ</title>
  <style>
    :root{font-family:"BIZ UDPGothic","Yu Gothic",sans-serif;color:#f7fbff;background:#030919;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 110%,#401552,#0a1835 55%,#020713)}.arena{position:relative;display:grid;height:100vh;place-items:center;overflow:hidden}.city{position:absolute;right:0;bottom:0;left:0;height:30%;opacity:.65;background:linear-gradient(90deg,#07101f 4%,transparent 4% 6%,#0a1425 6% 13%,transparent 13% 16%,#081020 16% 25%,transparent 25% 28%,#0b1628 28% 36%,transparent 36% 40%,#07101e 40% 51%,transparent 51% 54%,#0b1422 54% 65%,transparent 65% 68%,#071120 68% 78%,transparent 78% 82%,#0a1425 82% 94%,transparent 94%)}.mission-copy{position:absolute;z-index:6;top:clamp(12px,3vw,28px);left:clamp(14px,3vw,32px)}.tag{margin:0;color:#ffd84a;font-size:clamp(.6rem,1.6vw,.78rem);font-weight:900;letter-spacing:.16em}.mission-copy h1{margin:.2rem 0;font-size:clamp(1.35rem,5vw,3.2rem);line-height:1.05;text-shadow:0 0 18px #ff4fd888}.mission-copy p{margin:.3rem 0;color:#bed2ea;font-size:clamp(.7rem,1.8vw,.95rem)}.kaiju{position:absolute;right:10%;bottom:12%;font-size:clamp(6rem,25vw,15rem);filter:drop-shadow(0 0 25px #ff4fd877);animation:stomp .75s steps(2) infinite}.target{position:absolute;left:45%;top:52%;display:grid;width:min(40vw,250px);aspect-ratio:1;place-items:center;border:3px solid #ff647c;border-radius:50%;box-shadow:0 0 20px #ff647c,inset 0 0 32px #ff647c44;color:#ff647c;font:900 min(24vw,145px)/1 sans-serif;transform:translate(-50%,-50%);transition:.18s}.target:before{position:absolute;inset:-12%;border:2px dashed currentColor;border-radius:50%;content:"";animation:spin 4s linear infinite}.target.ready{color:#5dffb3;border-color:#5dffb3;box-shadow:0 0 35px #5dffb3,inset 0 0 42px #5dffb355;animation:ready .55s infinite alternate}.cue{position:absolute;z-index:8;left:45%;bottom:7%;padding:.55rem 1rem;border-radius:99px;background:#080f24dd;color:#ffb1bd;font-size:clamp(.8rem,2.2vw,1.15rem);font-weight:900;transform:translateX(-50%)}.cue.now{background:#5dffb3;color:#052418;box-shadow:0 0 25px #5dffb3;font-size:clamp(1.1rem,3vw,1.6rem)}.blast{position:absolute;z-index:10;left:45%;top:52%;width:20px;height:20px;border-radius:50%;background:white;box-shadow:0 0 25px white,0 0 70px #54ecff,0 0 120px #ff4fd8;opacity:0}.blast.on{animation:blast .7s ease}.result{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:#020715dd;text-align:center}.result[hidden]{display:none}.result strong{font-size:clamp(2.1rem,9vw,5.5rem);text-shadow:0 0 25px currentColor}.result.success strong{color:#5dffb3}.result.fail strong{color:#ff647c}.result p{color:#d5e5f6}@keyframes spin{to{transform:rotate(360deg)}}@keyframes stomp{to{transform:translateY(7px) rotate(2deg)}}@keyframes ready{to{transform:translate(-50%,-50%) scale(1.08)}}@keyframes blast{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}@media(max-height:430px){.kaiju{font-size:34vh}.target{width:38vh}.mission-copy h1{font-size:1.3rem}}
  </style>
</head>
<body><main class="arena"><div class="city"></div><section class="mission-copy"><p class="tag">MISSION 02 / TIMING</p><h1>宇宙怪獣を倒せ！</h1><p>照準が緑になった瞬間に、表示された形を作れ。</p></section><div class="kaiju" aria-hidden="true">👾</div><div class="target" id="target">△</div><div class="cue" id="cue">エネルギー充填中...</div><div class="blast" id="blast"></div><section class="result" id="result" hidden><div><strong id="resultTitle"></strong><p id="resultText"></p></div></section></main>
  <script>
    // このHTMLだけが「正しいタイミング」の合否を判定します。
    const required = Math.random()>.5?'delta':'napla'; const symbol=required==='delta'?'△':'▽';
    const target=document.getElementById('target'), cue=document.getElementById('cue'); target.textContent=symbol;
    let started=0, success=false, ended=false, raf;
    function loop(){if(ended)return;const elapsed=(performance.now()-started)/1000;const ready=elapsed>=4.1&&elapsed<=6.2;target.classList.toggle('ready',ready);cue.className=`cue ${ready?'now':''}`;cue.textContent=ready?`いまだ！ ${symbol}を作れ！`:elapsed<4.1?'エネルギー充填中...':'次の機会を待て...';raf=requestAnimationFrame(loop)}
    function cast(data){if(ended||data.gesture!==required)return;const elapsed=(performance.now()-started)/1000;if(elapsed>=4.1&&elapsed<=6.2){success=true;document.getElementById('blast').classList.remove('on');void document.body.offsetWidth;document.getElementById('blast').classList.add('on');cue.textContent='命中！'}}
    function finish(){if(ended)return;ended=true;cancelAnimationFrame(raf);const box=document.getElementById('result');box.hidden=false;box.className=`result ${success?'success':'fail'}`;document.getElementById('resultTitle').textContent=success?'怪獣撃破！':'攻撃失敗！';document.getElementById('resultText').textContent=success?'完璧なタイミングだ！':'緑色の「いまだ！」で形を作ろう。';parent.postMessage({type:'mission-result',success,score:success?100:0,reason:'timing'},'*')}
    addEventListener('message',e=>{const d=e.data||{};if(d.type==='mission-start'){started=performance.now();loop();setTimeout(finish,10000)}if(d.type==='gesture')cast(d)});
    parent.postMessage({type:'mission-ready',mission:'kaiju',title:'宇宙怪獣を倒せ！',instruction:`照準が緑になったら${symbol}を作れ`},'*');
  </script>
</body></html>
